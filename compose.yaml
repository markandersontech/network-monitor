name: network-monitor

services:

  influxdb:
    image: influxdb:3-core
    container_name: network-monitor-influxdb
    restart: unless-stopped

    command:
      - influxdb3
      - serve
      - --node-id=network-monitor
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --admin-token-file=/run/secrets/influxdb-admin-token

    ports:
      - "8181:8181"

    volumes:
      - ./data/influxdb:/var/lib/influxdb3/data

    secrets:
      - influxdb-admin-token

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8181/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - monitoring


  telegraf:
    image: telegraf:1.40.1
    container_name: network-monitor-telegraf
    restart: unless-stopped

    depends_on:
      influxdb:
        condition: service_healthy

    environment:
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      SNMP_COMMUNITY: ${SNMP_COMMUNITY}

    volumes:
      - ./config/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

      # Allow Telegraf to monitor Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - monitoring

    healthcheck:
      test:
        [
          "CMD",
          "telegraf",
          "--test",
          "--config",
          "/etc/telegraf/telegraf.conf"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


  grafana:
    image: grafana/grafana:13.1.0
    container_name: network-monitor-grafana
    restart: unless-stopped

    depends_on:
      influxdb:
        condition: service_healthy

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"

      INFLUX_TOKEN: ${INFLUX_TOKEN}

    volumes:
      - ./data/grafana:/var/lib/grafana

      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro

      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro

    networks:
      - monitoring

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:3000/api/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s


networks:
  monitoring:
    driver: bridge


secrets:
  influxdb-admin-token:
    file: ./secrets/influxdb-admin-token.json