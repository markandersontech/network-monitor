# ============================================================
# Network Monitor
# Telegraf Configuration
# ============================================================

[agent]

  interval = "30s"
  round_interval = true

  collection_jitter = "5s"

  flush_interval = "30s"
  flush_jitter = "5s"

  metric_batch_size = 1000
  metric_buffer_limit = 10000

  hostname = "network-monitor-telegraf"

  omit_hostname = false


# ============================================================
# INFLUXDB 3 OUTPUT
# ============================================================

[[outputs.influxdb_v3]]

  urls = ["http://influxdb:8181"]

  token = "${INFLUX_TOKEN}"

  database = "network_monitoring"

  timeout = "10s"


# ============================================================
# TELEGRAF INTERNAL METRICS
# ============================================================

[[inputs.internal]]

  collect_memstats = true


# ============================================================
# DOCKER MONITORING
# ============================================================

[[inputs.docker]]

  endpoint = "unix:///var/run/docker.sock"

  timeout = "5s"

  perdevice = true

  total = true

  container_state_include = [
    "created",
    "restarting",
    "running",
    "paused",
    "exited"
  ]

  docker_label_include = [
    "com.docker.compose.service"
  ]


# ============================================================
# SNMP
# ============================================================

[[inputs.snmp]]

  agents = [
    "udp://10.80.22.1:161",
    "udp://10.80.22.4:161",
    "udp://10.80.22.5:161",
    "udp://10.80.22.6:161",
    "udp://10.80.22.11:161"
  ]

  version = 2

  community = "${SNMP_COMMUNITY}"

  agent_host_tag = "source"

  timeout = "5s"

  retries = 2

  max_repetitions = 20


  # ----------------------------------------------------------
  # System information
  # ----------------------------------------------------------

  [[inputs.snmp.field]]

    oid = "RFC1213-MIB::sysName.0"

    name = "sysName"

    is_tag = true


  [[inputs.snmp.field]]

    oid = "RFC1213-MIB::sysDescr.0"

    name = "sysDescr"


  [[inputs.snmp.field]]

    oid = "RFC1213-MIB::sysUpTime.0"

    name = "uptime"


  [[inputs.snmp.field]]

    oid = "SNMPv2-MIB::sysLocation.0"

    name = "location"

    is_tag = true


  # ----------------------------------------------------------
  # Network interfaces
  # ----------------------------------------------------------

  [[inputs.snmp.table]]

    oid = "IF-MIB::ifTable"

    name = "interface"

    inherit_tags = [
      "sysName"
    ]


    [[inputs.snmp.table.field]]

      oid = "IF-MIB::ifDescr"

      name = "ifDescr"

      is_tag = true


    [[inputs.snmp.table.field]]

      oid = "IF-MIB::ifAlias"

      name = "ifAlias"

      is_tag = true


    [[inputs.snmp.table.field]]

      oid = "IF-MIB::ifOperStatus"

      name = "ifOperStatus"


    [[inputs.snmp.table.field]]

      oid = "IF-MIB::ifAdminStatus"

      name = "ifAdminStatus"


    [[inputs.snmp.table.field]]

      oid = "IF-MIB::ifInOctets"

      name = "ifInOctets"


    [[inputs.snmp.table.field]]

      oid = "IF-MIB::ifOutOctets"

      name = "ifOutOctets"


    [[inputs.snmp.table.field]]

      oid = "IF-MIB::ifInErrors"

      name = "ifInErrors"


    [[inputs.snmp.table.field]]

      oid = "IF-MIB::ifOutErrors"

      name = "ifOutErrors"


    [[inputs.snmp.table.field]]

      oid = "IF-MIB::ifInDiscards"

      name = "ifInDiscards"


    [[inputs.snmp.table.field]]

      oid = "IF-MIB::ifOutDiscards"

      name = "ifOutDiscards"


# ============================================================
# ICMP AVAILABILITY
# ============================================================

[[inputs.ping]]

  urls = [
    "10.80.22.1",
    "10.80.22.4",
    "10.80.22.5",
    "10.80.22.6",
    "10.80.22.11"
  ]

  count = 3

  ping_interval = 1.0

  timeout = 2.0

  method = "native"